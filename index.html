order:#ecd9b4}.group[data-category="视觉与视频"]{--color:#a54170;--soft:#fcf0f5;--border:#edcfdd}.group[data-category="互动与线索"]{--color:#ae4c30;--soft:#fff2eb;--border:#eed0c2}.group[data-category="00 读懂产品命名"],.group[data-category="平台"]{--color:#1465a6;--soft:#edf5fc;--border:#c9dfef}.group[data-category="01 认识设备组成"],.group[data-category="工具"]{--color:#137970;--soft:#eaf7f4;--border:#bee2db}.group[data-category="02 选择通信方式"]{--color:#6550b2;--soft:#f3effc;--border:#dcd3f2}.group[data-category="03 区分感知与定位"]{--color:#a54170;--soft:#fcf0f5;--border:#edcfdd}.group[data-category="04 理解设备怎样组网"]{--color:#956016;--soft:#fff7e8;--border:#ecd9b4}.group[data-category="05 认识板上的接口"]{--color:#ae4c30;--soft:#fff2eb;--border:#eed0c2}.group[data-category="06 看懂参数与软件资料"],.group[data-category="素材与选题管理"]{--color:#3B6D11;--soft:#f0f6e6;--border:#d5e5bc}.group h3{font-size:16px;color:var(--color);background:var(--soft);border-left:4px solid var(--color);padding:12px 14px;border-radius:0 8px 8px 0;margin:0 0 14px}.group h3 small{font-size:12px;font-weight:400;margin-left:10px}.group h3{display:flex;align-items:center;cursor:pointer;user-select:none}.group h3 .fold{margin-left:auto;font-size:13px;transition:transform .2s}.group.folded .fold{transform:rotate(-90deg)}.group.folded .grid{display:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--border);border-top:3px solid var(--color);border-radius:9px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:7px}.card strong{font-size:15px;overflow-wrap:anywhere;font-weight:600}.card small{font-size:12px;color:#788473}.card .open{font-size:13px;color:var(--color);margin-top:auto;padding-top:12px}.card:hover{background:var(--soft)}.skill-name{font-family:system-ui,sans-serif}.copy{align-self:flex-start;background:var(--soft);border:1px solid var(--border);color:var(--color);font-size:13px;padding:7px 11px;border-radius:6px;margin-top:10px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;background:#fffefa;border-top:1px solid #dfe5d7;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:4}nav button{min-width:100px;padding:9px 20px;border:0;border-radius:9px;background:transparent;color:#747e6b;font-size:14px}nav button.active{background:#e4edd6;color:#354b26;font-weight:600}.statusbar{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#7b8674;margin-top:26px;flex-wrap:wrap}.statusbar button{background:none;border:0;font-size:12px;color:#536d3e;text-decoration:underline}.help{background:#edf2e6;border:1px solid #dce6cf;border-radius:9px;padding:14px;font-size:13px;color:#59694f;margin-top:15px;line-height:1.8}.step1{margin:0 0 16px;background:#edf5fc;border:2px solid #1465a6;border-radius:12px;padding:13px 15px}.step1 a{display:block;text-decoration:none;color:inherit}.step1 strong{display:block;font-size:15px;color:#1465a6;margin-bottom:3px}.step1 span{font-size:13px;color:#33475a;line-height:1.6}.empty{text-align:center;color:#77816e;padding:50px 12px}#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#27332a;color:white;border-radius:9px;font-size:14px;padding:12px 18px;max-width:90vw;z-index:6}#error{background:#fff0e7;padding:12px;color:#925432;border-radius:8px;margin:15px 0;font-size:14px}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}nav{gap:2px;flex-wrap:wrap}nav button{min-width:0;flex:1;padding:10px 8px;font-size:13px}header{padding:20px}main{padding:23px 18px 115px}.card{padding:14px}h2{font-size:24px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.toolbar select{max-width:116px}.card{gap:6px}.brand{gap:9px}header small{font-size:11px}}
</style></head><body><header><div class="brand"><span class="logo">m.</span><div><h1>Maeve</h1><small>口袋工作台 · 只读版</small></div></div><button id="install" hidden>安装到手机</button></header><main><div class="step1"><a href="./classroom.html"><strong>第 1 步 · 先看物联网漫画课堂 ↗</strong><span>通过生活场景理解「传感器采集 → 设备处理 → 通信传输 → 平台应用」，认识安信可的上下游关系。</span></a></div><div class="intro"><div><h2 id="title">产品资料</h2><p id="subtitle">按产品系列，随时查找。</p></div><span class="count" id="count"></span></div><div class="toolbar"><input id="search" type="search" placeholder="搜索名称或系列" aria-label="搜索名称或系列"><select id="filter" aria-label="分类"><option>全部</option></select></div><div id="error" role="alert" hidden></div><div id="content"><p class="empty">正在读取资料…</p></div><div class="statusbar"><span id="updated"></span><button id="refresh">检查更新</button></div><details class="help"><summary>安装与更新说明</summary>在安卓 Chrome 中打开本站，点击“安装到手机”；如果未显示按钮，可从浏览器菜单选择“添加到主屏幕”或“安装应用”。<br>这里显示的是已发布快照。本机工作台修改后，需要重新导出并上传，手机才会获取新内容。断网时可查看上次缓存；打开外部链接需要网络。<br>这是公开查看版，不包含内部备注、草稿、登录参数或个人使用次数。</details></main><nav aria-label="栏目"><button data-tab="terms" class="active">IoT 术语</button><button data-tab="products">产品资料</button><button data-tab="skills">Skill 集合</button><button data-tab="websites">网站入口</button></nav><div id="toast" role="status" hidden></div><script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data,tab='terms',installPrompt,timer,cached=false;
const labels={terms:['IoT 术语学习','定义、应用例子与易混点。'],products:['产品资料','按产品系列，随时查找。'],skills:['Skill 集合','按用途查找，复制调用提示词。'],topics:['已发布内容','已有公开链接的内容记录。'],websites:['网站入口','常用平台与工具。']};
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,4000);}
const groupKey=r=>tab==='topics'?r.platform:r.category;
function render(reset=false){if(!data)return;const rows=data[tab];if(reset){$('#search').value='';$('#filter').innerHTML='<option>全部</option>'+[...new Set(rows.map(groupKey))].map(c=>`<option>${esc(c)}</option>`).join('');}const search=$('#search').value.toLowerCase(),filter=$('#filter').value;const found=rows.filter(r=>(filter==='全部'||groupKey(r)===filter)&&Object.values(r).join(' ').toLowerCase().includes(search));$('#title').textContent=labels[tab][0];$('#subtitle').textContent=labels[tab][1];$('#count').textContent=found.length;$('#content').innerHTML=[...new Set(found.map(groupKey))].map(c=>{const entries=found.filter(r=>groupKey(r)===c);return `<section class="group" data-category="${esc(c)}"><h3 tabindex="0" role="button" aria-expanded="true"><span>${esc(c)}</span><small>${entries.length} 项</small><span class="fold" aria-hidden="true">▾</span></h3><div class="grid">${entries.map(r=>tab==='terms'?`<article class="card"><strong>${esc(r.name)}</strong><p>${esc(r.definition)}</p><small>例子：${esc(r.example)}</small><p>${esc(r.caution)}</p><small>核对资料：${esc(r.reference)}</small></article>`:tab==='skills'?`<article class="card"><strong class="skill-name">${esc(r.name)}</strong><small>${esc(r.category)}</small><button class="copy" data-skill="${esc(r.name)}">复制提示词</button></article>`:`<a class="card" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><strong>${esc(r.name||r.title)}</strong><small>${esc(r.family||r.product||r.category)}</small><span class="open">${tab==='products'?'官方文档':tab==='topics'?'查看内容':'打开网站'} ↗</span></a>`).join('')}</div></section>`;}).join('')||'<p class="empty">没有匹配的内容，试试其他关键词。</p>';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});$('#updated').textContent=(navigator.onLine&&!cached?'快照更新：':'离线快照：')+new Date(data.updatedAt).toLocaleString('zh-CN',{hour12:false});}
async function load(){try{const r=await fetch('./data.json',{cache:'no-cache'});if(!r.ok)throw Error();cached=r.headers.get('X-Maeve-Cache')==='offline';data=await r.json();$('#error').hidden=true;render(true);}catch{$('#error').textContent='暂时无法读取，请联网后重试。';$('#error').hidden=false;}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render(true);window.scrollTo(0,0);}if(b.dataset.skill){try{await navigator.clipboard.writeText('使用 $'+b.dataset.skill+' 帮我完成以下任务：');toast('已复制，请粘贴到支持该 Skill 的 AI 工具中。');}catch{toast('复制失败，请长按 Skill 名称复制。');}}});
$('#search').addEventListener('input',()=>render());$('#filter').addEventListener('change',()=>render());$('#content').addEventListener('click',e=>{const h=e.target.closest('.group h3');if(!h)return;const g=h.parentElement;g.classList.toggle('folded');h.setAttribute('aria-expanded',g.classList.contains('folded')?'false':'true');});$('#content').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const h=e.target.closest?e.target.closest('.group h3'):null;if(h){e.preventDefault();h.click();}});
$('#refresh').onclick=async()=>{await load();if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistration();if(r)await r.update().catch(()=>{});}if(!$('#error').hidden)return;toast(navigator.onLine&&!cached?'已读取线上最新快照。':'无法连接线上版本，显示上次缓存。');};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install').hidden=false;});$('#install').onclick=async()=>{if(!installPrompt)return;await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#install').hidden=true;};window.addEventListener('appinstalled',()=>{$('#install').hidden=true;toast('已安装到手机桌面。');});
window.addEventListener('online',()=>load());window.addEventListener('offline',()=>render());
if('serviceWorker'in navigator){const controlled=!!navigator.serviceWorker.controller;let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(controlled&&!reloading){reloading=true;location.reload();}});navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});}
load();
</script></body></html>
